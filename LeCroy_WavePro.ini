# Instrument driver configuration file for LeCroy WavePro Oscilloscope

[General settings]

# The name is shown in all the configuration windows
name: LeCroy WavePro

# The version string should be updated whenever changes are made to this config file
version: 0.1.0

# Name of folder containing the code defining a custom driver. Do not define this item
# or leave it blank for any standard driver based on the built-in VISA interface.
driver_path: LeCroy_WavePro

# Default communication parameters
interface: TCPIP
address: 192.168.1.100

# Timeout for communication (in seconds)
timeout: 10.0

# Query instrument errors (default is False)
use_error_queue: False

[Model and options]
# List of models supported by this driver
model_str_1: WavePro 254HD-MS
model_str_2: WavePro

# Valid options for the model
# None currently


# =============================================================================
# TIMEBASE SETTINGS
# =============================================================================

[Time range]
datatype: DOUBLE
unit: s
def_value: 1.0E-3
low_lim: 1.0E-9
high_lim: 1.0E3
tooltip: Total time range shown on screen (10 divisions)
group: Timebase
section: Timebase
show_in_measurement_dlg: True

[Sample rate]
datatype: DOUBLE
unit: Sa/s
def_value: 1.0E9
low_lim: 1.0E3
high_lim: 20.0E9
tooltip: Sampling rate (samples per second)
group: Timebase
section: Timebase
show_in_measurement_dlg: True
state_quant: Use custom sample rate
state_value_1: True

[Memory length]
datatype: DOUBLE
def_value: 10000
low_lim: 500
high_lim: 100E6
tooltip: Number of samples to acquire
group: Timebase
section: Timebase
show_in_measurement_dlg: True
state_quant: Use custom memory length
state_value_1: True

[Use custom sample rate]
datatype: BOOLEAN
def_value: False
tooltip: Enable to manually set sample rate
group: Timebase
section: Timebase

[Use custom memory length]
datatype: BOOLEAN
def_value: False
tooltip: Enable to manually set memory length
group: Timebase
section: Timebase


# =============================================================================
# TRIGGER SETTINGS
# =============================================================================

[Trigger mode]
datatype: COMBO
def_value: Normal
combo_def_1: Auto
combo_def_2: Normal
combo_def_3: Single
combo_def_4: Stop
tooltip: Trigger mode: Auto (always triggers), Normal (waits for trigger), Single (one shot), Stop (stopped)
group: Trigger
section: Trigger
show_in_measurement_dlg: True

[Trig source]
datatype: COMBO
def_value: Channel 1
combo_def_1: Channel 1
combo_def_2: Channel 2
combo_def_3: Channel 3
combo_def_4: Channel 4
combo_def_5: External
cmd_def_1: C1
cmd_def_2: C2
cmd_def_3: C3
cmd_def_4: C4
cmd_def_5: EX
tooltip: Trigger source channel
group: Trigger
section: Trigger
show_in_measurement_dlg: True

[Trig slope]
datatype: COMBO
def_value: Positive
combo_def_1: Positive
combo_def_2: Negative
cmd_def_1: POS
cmd_def_2: NEG
tooltip: Trigger on positive or negative edge
group: Trigger
section: Trigger
show_in_measurement_dlg: True

[Trig level]
datatype: DOUBLE
unit: V
def_value: 0.0
low_lim: -10.0
high_lim: 10.0
tooltip: Trigger level in volts
group: Trigger
section: Trigger
show_in_measurement_dlg: True


# =============================================================================
# CHANNEL 1 SETTINGS
# =============================================================================

[Ch1 - Enabled]
datatype: BOOLEAN
def_value: True
set_cmd: C1:TRA
cmd_def_1: ON
cmd_def_2: OFF
tooltip: Enable/disable channel 1
group: Channel 1
section: Channels
show_in_measurement_dlg: True

[Ch1 - Coupling]
datatype: COMBO
def_value: DC 1M
combo_def_1: DC 1M
combo_def_2: AC 1M
combo_def_3: DC 50
combo_def_4: AC 50
combo_def_5: Ground
cmd_def_1: D1M
cmd_def_2: A1M
cmd_def_3: D50
cmd_def_4: A50
cmd_def_5: GND
set_cmd: C1:CPL
tooltip: Input coupling for channel 1
group: Channel 1
section: Channels

[Ch1 - Voltage range]
datatype: DOUBLE
unit: V
def_value: 1.0
low_lim: 0.001
high_lim: 100.0
set_cmd: C1:VDIV
tooltip: Voltage per division for channel 1
group: Channel 1
section: Channels

[Ch1 - Offset]
datatype: DOUBLE
unit: V
def_value: 0.0
low_lim: -100.0
high_lim: 100.0
set_cmd: C1:OFST
tooltip: Voltage offset for channel 1
group: Channel 1
section: Channels

[Ch1 - Data]
datatype: VECTOR
permission: READ
unit: V
x_name: Time
x_unit: s
tooltip: Waveform data from channel 1
group: Channel 1
section: Channels
show_in_measurement_dlg: True


